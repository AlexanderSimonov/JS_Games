<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Dropping Merge 2048</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1a252f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 460px;
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: bold;
            padding: 0 5px;
        }
        #game-container {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            width: 100%;
            max-width: 460px;
            justify-content: center;
        }
        canvas#gameCanvas {
            background: #34495e;
            border: 4px solid #bdc3c7;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            max-width: 73%;
            height: auto;
            aspect-ratio: 350 / 600;
            -webkit-tap-highlight-color: transparent;
        }
        #side-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 25%;
            min-width: 85px;
        }
        #next-box {
            background: #2c3e50;
            border: 4px solid #bdc3c7;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 100%;
        }
        #next-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            color: #bdc3c7;
            font-weight: bold;
            text-align: center;
        }
        canvas#nextCanvas {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
        }
        .menu-btn {
            width: 100%;
            color: white;
            border: none;
            padding: 8px 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-btn:active {
            transform: scale(0.96);
        }
        #btn-pause { background-color: #f39c12; }
        #btn-pause:hover { background-color: #d35400; }
        #btn-new-game { background-color: #2ecc71; }
        #btn-new-game:hover { background-color: #27ae60; }
        #btn-reset { background-color: #e74c3c; }
        #btn-reset:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div>Счет: <span id="score">0</span></div>
        <div>Рекорд: <span id="high-score">0</span></div>
    </div>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="350" height="550"></canvas>
        <div id="side-panel">
            <div id="next-box">
                <div id="next-title">Далее</div>
                <canvas id="nextCanvas" width="70" height="70"></canvas>
            </div>
            <button id="btn-pause" class="menu-btn" onclick="togglePause()">Пауза</button>
            <button id="btn-reset" class="menu-btn" onclick="resetHighScore()">Сброс рекорда</button>
            <button id="btn-new-game" class="menu-btn" onclick="startNewGame()">Новая игра</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('nextCanvas');
        const nextCtx = nextCanvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');
        const pauseButton = document.getElementById('btn-pause');

        const COLS = 5;
        const ROWS = 8;
        const BLOCK_SIZE = canvas.width / COLS;

        let score = 0;
        let highScore = parseInt(localStorage.getItem('merge2048_highscore')) || 0;
        highScoreElement.innerText = highScore;

        let isPaused = false;
        let grid = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); });

        const colors = {
            2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
            32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
            512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
        };
        const textColors = { 2: '#776e65', 4: '#776e65' };

        function getRandomValue() {
            let values = Array.of(2, 4, 8, 16);
            if (score >= 1000) { values = Array.of(4, 8, 16, 32, 64); }
            else if (score >= 500) { values = Array.of(2, 4, 8, 16, 32); }
            return values[Math.floor(Math.random() * values.length)];
        }

        let currentBlock = { x: 2, y: 0, value: getRandomValue(), scale: 0 };
        let nextBlockValue = getRandomValue();

        function togglePause() {
            isPaused = !isPaused;
            if (isPaused) {
                pauseButton.innerText = 'Продолжить';
                pauseButton.style.backgroundColor = '#2ecc71';
            } else {
                pauseButton.innerText = 'Пауза';
                pauseButton.style.backgroundColor = '#f39c12';
                lastTime = performance.now();
            }
        }

        function resetHighScore() {
            if (confirm('Вы уверены, что хотите обнулить лучший результат?')) {
                highScore = 0; highScoreElement.innerText = '0';
                localStorage.setItem('merge2048_highscore', '0');
            }
        }

        function startNewGame() {
            if (confirm('Начать игру заново? Текущий счет обнулится.')) {
                grid = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); });
                score = 0; scoreElement.innerText = '0';
                isPaused = false; pauseButton.innerText = 'Пауза'; pauseButton.style.backgroundColor = '#f39c12';
                currentBlock = { x: 2, y: 0, value: getRandomValue(), scale: 0 };
                nextBlockValue = getRandomValue(); drawNextBlock();
            }
        }
        let particles = [];
        function drawNextBlock() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            const size = nextCanvas.width;
            nextCtx.fillStyle = colors[nextBlockValue] || '#3c3a32';
            nextCtx.fillRect(2, 2, size - 4, size - 4);
            nextCtx.fillStyle = textColors[nextBlockValue] || '#f9f6f2';
            nextCtx.font = 'bold ' + Math.floor(size * 0.35) + 'px Arial';
            nextCtx.textAlign = 'center'; nextCtx.textBaseline = 'middle';
            nextCtx.fillText(nextBlockValue, size / 2, size / 2);
        }

        function createFlash(col, row) {
            const centerX = col * BLOCK_SIZE + BLOCK_SIZE / 2;
            const centerY = row * BLOCK_SIZE + BLOCK_SIZE / 2;
            const particleCount = 15;
            for (let i = 0; i < particleCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 2.5;
                particles.push({
                    x: centerX, y: centerY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
                    radius: 1.5 + Math.random() * 3, alpha: 1, color: Math.random() > 0.4 ? '#ffffff' : '#f1c40f'
                });
            }
        }

        function updateAndDrawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.04;
                if (p.alpha <= 0) { particles.splice(i, 1); } 
                else {
                    ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore();
                }
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
            ctx.lineWidth = 1;
            for (let c = 1; c < COLS; c++) {
                ctx.beginPath(); ctx.moveTo(c * BLOCK_SIZE, 0); ctx.lineTo(c * BLOCK_SIZE, canvas.height); ctx.stroke();
            }
            for (let r = 1; r < ROWS; r++) {
                ctx.beginPath(); ctx.moveTo(0, r * BLOCK_SIZE); ctx.lineTo(canvas.width, r * BLOCK_SIZE); ctx.stroke();
            }
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] !== 0) { drawBlock(c, r, grid[r][c], 1); }
                }
            }
            updateAndDrawParticles();
        }

        function drawBlock(col, rowY, value, scale) {
            if (!value) return; 
            ctx.save();
            ctx.translate(col * BLOCK_SIZE + BLOCK_SIZE / 2, rowY * BLOCK_SIZE + BLOCK_SIZE / 2);
            ctx.scale(scale, scale); ctx.fillStyle = colors[value] || '#3c3a32'; 
            ctx.fillRect(-BLOCK_SIZE / 2 + 2, -BLOCK_SIZE / 2 + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
            ctx.fillStyle = textColors[value] || '#f9f6f2';
            ctx.font = 'bold ' + Math.floor(BLOCK_SIZE * 0.4) + 'px Arial';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(value, 0, 0); ctx.restore();
        }
        function getCluster(startR, startC, targetValue, visited) {
            const cluster = [];
            const queue = [{ r: startR, c: startC }];
            visited[startR][startC] = true;
            const dirs = [{ dr: -1, dc: 0 }, { dr: 1, dc: 0 }, { dr: 0, dc: -1 }, { dr: 0, dc: 1 }];
            while (queue.length > 0) {
                const current = queue.shift(); cluster.push(current);
                for (let i = 0; i < dirs.length; i++) {
                    const nr = current.r + dirs[i].dr; const nc = current.c + dirs[i].dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                        if (!visited[nr][nc] && grid[nr][nc] === targetValue) {
                            visited[nr][nc] = true; queue.push({ r: nr, c: nc });
                        }
                    }
                }
            }
            return cluster;
        }

        function calculateMergedValue(initialValue, clusterSize) {
            return initialValue * Math.pow(2, Math.floor(clusterSize / 2));
        }

        function mergeBlocks(playerLockX, playerLockY) {
            let merged = false;
            let visited = Array.from({ length: ROWS }, function() { return Array(COLS).fill(false); });
            if (playerLockX !== undefined && playerLockY !== undefined && grid[playerLockY][playerLockX] !== 0) {
                const targetValue = grid[playerLockY][playerLockX];
                const cluster = getCluster(playerLockY, playerLockX, targetValue, visited);
                if (cluster.length >= 2) {
                    let finalTargetR = playerLockY;
                    if (playerLockY + 1 < ROWS && grid[playerLockY + 1][playerLockX] === targetValue) finalTargetR = playerLockY + 1;
                    applyClusterMerge(cluster, finalTargetR, playerLockX, targetValue); merged = true;
                }
            }
            for (let r = ROWS - 1; r >= 0; r--) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] !== 0 && !visited[r][c]) {
                        const targetValue = grid[r][c]; const cluster = getCluster(r, c, targetValue, visited);
                        if (cluster.length >= 2) {
                            const sliceCluster = cluster.slice(); const firstItem = sliceCluster.shift();
                            let targetR = firstItem.r; let targetC = firstItem.c;
                            for (let i = 0; i < sliceCluster.length; i++) {
                                if (sliceCluster[i].r > targetR) { targetR = sliceCluster[i].r; targetC = sliceCluster[i].c; }
                            }
                            applyClusterMerge(cluster, targetR, targetC, targetValue); merged = true;
                        }
                    }
                }
            }
            if (merged) { dropFloatingBlocks(); mergeBlocks(); }
        }

        function applyClusterMerge(cluster, targetR, targetC, targetValue) {
            const newValue = calculateMergedValue(targetValue, cluster.length);
            for (let i = 0; i < cluster.length; i++) { grid[cluster[i].r][cluster[i].c] = 0; }
            grid[targetR][targetC] = newValue; createFlash(targetC, targetR);
            score += newValue; scoreElement.innerText = score;
            if (score > highScore) {
                highScore = score; highScoreElement.innerText = highScore;
                localStorage.setItem('merge2048_highscore', highScore);
            }
        }

        function dropFloatingBlocks() {
            let moved = false;
            for (let c = 0; c < COLS; c++) {
                for (let r = ROWS - 2; r >= 0; r--) {
                    if (grid[r][c] !== 0 && grid[r + 1][c] === 0) {
                        let targetRow = r;
                        while (targetRow + 1 < ROWS && grid[targetRow + 1][c] === 0) targetRow++;
                        grid[targetRow][c] = grid[r][c]; grid[r][c] = 0; moved = true;
                    }
                }
            }
            if (moved) { dropFloatingBlocks(); }
        }

        function lockBlock() {
            if (isPaused) return;
            const lockX = currentBlock.x; const lockY = getLowestAvailableRow(lockX);
            if (lockY < 0) return;
            grid[lockY][lockX] = currentBlock.value;
            if (lockY === 0) {
                alert('Игра окончена! Счет: ' + score);
                grid = Array.from({ length: ROWS }, function() { return Array(COLS).fill(0); });
                score = 0; scoreElement.innerText = score;
            } else { mergeBlocks(lockX, lockY); }
            currentBlock = { x: 2, y: 0, value: nextBlockValue, scale: 0 };
            nextBlockValue = getRandomValue(); drawNextBlock();
        }

        function getLowestAvailableRow(col) {
            for (let r = ROWS - 1; r >= 0; r--) { if (grid[r][col] === 0) return r; }
            return -1;
        }

        function handleInput(clientX) {
            if (isPaused) return;
            const rect = canvas.getBoundingClientRect();
            const clickedCol = Math.floor(((clientX - rect.left) / rect.width) * COLS);
            if (clickedCol >= 0 && clickedCol < COLS) {
                const currentRow = Math.floor(currentBlock.y);
                if (currentRow < ROWS && grid[currentRow][clickedCol] === 0) { currentBlock.x = clickedCol; }
            }
        }

        let touchStartY = 0, touchStartX = 0;
        canvas.addEventListener('touchstart', function(e) {
            if (isPaused) return; e.preventDefault();
            const touch = e.touches[0]; touchStartY = touch.clientY; touchStartX = touch.clientX;
            handleInput(touch.clientX);
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            if (isPaused) return; e.preventDefault();
            const touch = e.changedTouches[0];
            const diffY = touch.clientY - touchStartY; const diffX = touch.clientX - touchStartX;
            if (diffY > 40 && Math.abs(diffY) > Math.abs(diffX)) { lockBlock(); }
        }, { passive: false });

        canvas.addEventListener('click', function(e) { handleInput(e.clientX); });

        window.addEventListener('keydown', function(e) {
            if (isPaused) return; const currentRow = Math.floor(currentBlock.y);
            if (e.key === 'ArrowLeft' && currentBlock.x > 0 && grid[currentRow][currentBlock.x - 1] === 0) currentBlock.x--;
            if (e.key === 'ArrowRight' && currentBlock.x < COLS - 1 && grid[currentRow][currentBlock.x + 1] === 0) currentBlock.x++;
            if (e.key === 'ArrowDown') lockBlock();
        });

        let lastTime = 0;
        function update(time) {
            if (!time) time = 0;
            const deltaTime = time - lastTime; lastTime = time;
            if (!isPaused) {
                const speed = 0.0004 + (score * 0.00000005);
                const lowestRow = getLowestAvailableRow(currentBlock.x);
                if (currentBlock.scale < 1) { currentBlock.scale += 0.08; if (currentBlock.scale > 1) currentBlock.scale = 1; }
                if (lowestRow >= 0) {
                    const nextY = currentBlock.y + deltaTime * speed;
                    if (nextY >= lowestRow) lockBlock(); else currentBlock.y = nextY;
                } else { lockBlock(); }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid(); drawBlock(currentBlock.x, currentBlock.y, currentBlock.value, currentBlock.scale);
            if (isPaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff'; ctx.font = 'bold 36px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('ПАУЗА', canvas.width / 2, canvas.height / 2);
            }
            requestAnimationFrame(update);
        }
        drawNextBlock(); update();
    </script>
</body>
</html>
